<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Nunito:wght@400;600&family=Caveat:wght@600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#22102b;--bg2:#331743;--rose:#f4a7b9;--gold:#f7c65a;--ink:#fff4ee;--mute:#cdb6d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Nunito,system-ui,sans-serif;overflow-x:hidden}
h1,h2{font-family:Gloock,Georgia,serif;font-weight:400;line-height:1.1;margin:0}
h1{font-size:clamp(2.6rem,10vw,5.5rem)}
h2{font-size:clamp(1.8rem,6vw,2.8rem);margin-bottom:1.5rem}
section{max-width:960px;margin:0 auto;padding:4.5rem 1.25rem}
.hidden{display:none!important}
#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.25rem;background:radial-gradient(ellipse at 50% 30%,rgba(51,23,67,.85),transparent 70%)}
#lock p{color:var(--mute);max-width:32ch;margin:1rem 0 2rem}
.clock{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}
.clock div{min-width:72px;padding:.9rem .5rem;border:1px solid var(--rose);border-radius:14px}
.clock b{display:block;font:400 2rem/1 Gloock,Georgia,serif;color:var(--gold)}
.clock span{font-size:.85rem;color:var(--mute)}
#pv{margin-top:2.5rem;background:none;border:1px solid var(--mute);color:var(--mute);padding:.6rem 1rem;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
#pv:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#hero{min-height:90vh;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center}
#hero h1 span{color:var(--rose)}
#hero p{color:var(--mute);margin-top:1.5rem;max-width:34ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.grid img.wide{grid-column:1/-1;aspect-ratio:auto;height:auto;max-height:70vh}
.grid img,.ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block}
.ph{display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px dashed var(--mute);color:var(--mute);font-size:.9rem}
video,.vph{width:100%;aspect-ratio:16/9;max-height:70vh;border-radius:10px;background:#000}
.vph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px dashed var(--mute);color:var(--mute)}
.tl{border-left:2px solid var(--rose);margin-left:.5rem;padding-left:1.5rem}
.tl div{margin-bottom:2rem;position:relative}
.tl div::before{content:"";position:absolute;left:calc(-1.5rem - 7px);top:.55rem;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.tl h3{margin:0;font:400 1.3rem Gloock,Georgia,serif;color:var(--gold)}
.tl p{margin:.25rem 0 0;color:var(--mute);max-width:60ch}
.letter{background:var(--ink);color:#3a1f45;padding:2rem 1.5rem;border-radius:4px;max-width:640px;margin:0 auto;font-size:1.1rem;white-space:pre-line}
.letter h2{color:#3a1f45;font-size:1.8rem}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
.grid img,.ph,video,.vph,.clock div,.letter{border:2px solid var(--rose);border-radius:24px;box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 26px rgba(244,167,185,.2)}
.heart{width:.6em;height:.6em;fill:#ff5c7a;vertical-align:.02em;margin-left:.2em;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.heart{animation:none}}
#fw{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--ink);animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}
#lock,#site{position:relative;z-index:1}
#hero{position:relative;overflow:hidden}
.b{position:absolute;width:54px;height:68px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;animation:rise 2.4s cubic-bezier(.2,.8,.2,1) backwards,bob 5s ease-in-out infinite}
.b:nth-of-type(1){animation-delay:.2s,0s}
.b:nth-of-type(2){animation-delay:.6s,-1.5s}
.b:nth-of-type(3){animation-delay:1s,-3s}
.b:nth-of-type(4){animation-delay:.4s,-2s}
@keyframes rise{from{translate:0 110vh}to{translate:0 0}}
.shiva{width:110px;filter:drop-shadow(0 0 16px rgba(247,198,90,.75));animation:shivaIn 2.2s ease 1.4s backwards}
@keyframes shivaIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.hail{font:400 1.2rem Gloock,Georgia,serif;color:var(--gold);margin:.5rem 0 1rem;animation:shivaIn 2.2s ease 1.8s backwards}
.cake{cursor:pointer}
.flame.out{animation:none;opacity:0;transform:scale(0);transition:opacity .5s,transform .5s}
#blow{margin-top:1.25rem;background:var(--gold);color:#3a1f45;border:0;padding:.75rem 1.25rem;border-radius:999px;font:600 1rem Nunito,system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#blow:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#wish{font:400 1.7rem Gloock,Georgia,serif;color:var(--gold);margin-top:1.25rem}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:80px;background:var(--mute)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-22px) rotate(3deg)}}
.cake{width:min(230px,60vw);margin-top:1.5rem}
.flame{transform-origin:50% 100%;opacity:var(--lv,1);filter:drop-shadow(0 0 calc(7px * var(--lv,1)) #ffb347);transition:opacity .15s;animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(1,.85)}to{transform:scale(.85,1.15)}}
@media (prefers-reduced-motion:reduce){.star,.b,.flame{animation:none}}
@media (prefers-reduced-motion:reduce){canvas{display:none}}
/* ===== enhancements ===== */
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#aurora i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.35;animation:drift 22s ease-in-out infinite alternate}
#aurora i:nth-child(1){background:#7a2d8f;left:-20vmax;top:-20vmax}
#aurora i:nth-child(2){background:#e0527a;right:-25vmax;bottom:-25vmax;opacity:.28;animation-delay:-8s}
#aurora i:nth-child(3){background:#f7c65a;left:30vw;top:40vh;width:35vmax;height:35vmax;opacity:.12;animation-delay:-14s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(12vmax,8vmax) scale(1.2)}}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:20;background:linear-gradient(90deg,var(--rose),var(--gold))}
#hearts{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fh{position:absolute;bottom:-40px;font-style:normal;font-size:var(--s);opacity:0;animation:floatUp var(--d) linear infinite;animation-delay:var(--l)}
@keyframes floatUp{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.45}100%{transform:translate(var(--x),-115vh) rotate(25deg);opacity:0}}
.sp{position:fixed;z-index:25;pointer-events:none;font-style:normal;font-size:14px;transform:translate(-50%,-50%);animation:sp .9s ease-out forwards}
@keyframes sp{to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 40px)) scale(.4)}}
#lock h1{text-shadow:0 0 30px rgba(244,167,185,.35)}
#hero h1{animation:up 1.4s cubic-bezier(.2,.8,.2,1) .2s backwards}
@keyframes up{from{opacity:0;transform:translateY(30px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#hero h1 span{background:linear-gradient(90deg,#f4a7b9,#f7c65a,#fff4ee,#f4a7b9);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.cake{filter:drop-shadow(0 0 calc(34px * var(--lv,1)) rgba(255,179,71,.45));animation:bobc 4s ease-in-out infinite}
@keyframes bobc{0%,100%{translate:0 0}50%{translate:0 -7px}}
#blow{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(247,198,90,.55)}70%{box-shadow:0 0 0 18px rgba(247,198,90,0)}100%{box-shadow:0 0 0 0 rgba(247,198,90,0)}}
.rv{opacity:0;transform:translateY(36px) scale(.97);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.grid img.rv{cursor:zoom-in;transition:opacity .9s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.grid img:nth-child(odd).in{transform:rotate(-1.2deg)}
.grid img:nth-child(even).in{transform:rotate(1.2deg)}
.grid img.wide.in{transform:none}
@media (hover:hover){.grid img.in:hover{transform:rotate(0) scale(1.03);z-index:2;position:relative}}
.lp{margin:0 0 1.1rem;opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1s ease}
.letter.in .lp{opacity:1;transform:none}
#lb{position:fixed;inset:0;z-index:30;background:rgba(15,5,20,.92);display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;border-radius:18px;border:2px solid var(--rose);box-shadow:0 0 60px rgba(244,167,185,.35)}
@media (prefers-reduced-motion:reduce){#aurora i,.cake,#blow,#hero h1,#hero h1 span,.fh{animation:none}.rv,.lp{opacity:1!important;transform:none!important;transition:none}}
/* ===== envelope ===== */
#env{position:relative;width:min(340px,86vw);aspect-ratio:3/2;margin:2rem auto 0;cursor:pointer;perspective:900px}
#env .e-back{position:absolute;inset:0;border-radius:10px;background:#e08fa4;box-shadow:0 18px 34px rgba(0,0,0,.55),0 0 30px rgba(244,167,185,.25)}
.e-paper{position:absolute;left:7%;right:7%;top:6%;bottom:8%;border-radius:6px;background:repeating-linear-gradient(#fff4ee 0 15px,#f1d6d6 15px 16px);transition:transform .8s ease .5s}
.e-front{position:absolute;inset:0;width:100%;height:100%;clip-path:inset(0 round 10px);pointer-events:none}
.e-flap{position:absolute;left:0;right:0;top:0;height:55%;background:#f7bfcb;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:3}
.e-seal{position:absolute;left:50%;top:55%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a8a,#c2243f);color:#fff4ee;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:4;box-shadow:0 4px 10px rgba(0,0,0,.45);transition:opacity .4s;animation:sealBeat 1.4s ease-in-out infinite}
@keyframes sealBeat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
#env.open .e-flap{transform:rotateX(180deg)}
#env.open .e-paper{transform:translateY(-38%)}
#env.open .e-seal{opacity:0}
#env.fade{opacity:0;transition:opacity .4s}
.e-tap{text-align:center;color:var(--gold);margin:1.5rem 0 0;animation:pulseText 2s ease-in-out infinite}
@keyframes pulseText{0%,100%{opacity:.5}50%{opacity:1}}
.letter h2{font-family:Caveat,Georgia,cursive;font-weight:600;font-size:2.6rem;color:#c2243f}
.letter.open{animation:paperIn .9s cubic-bezier(.2,.8,.2,1)}
@keyframes paperIn{from{opacity:0;transform:translateY(50px) scale(.94)}to{opacity:1;transform:none}}
/* ===== crazy video ===== */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:true}
#video{position:relative}
.vframe{position:relative;padding:4px;border-radius:30px;background:conic-gradient(from var(--a),#f4a7b9,#f7c65a,#b98be0,#ff7a8a,#f4a7b9);animation:spinA 5s linear infinite}
@keyframes spinA{to{--a:360deg}}
.vframe::before{content:"";position:absolute;inset:-6px;border-radius:36px;background:inherit;filter:blur(28px);opacity:.7;z-index:-1}
.vframe video{border:0;border-radius:26px;box-shadow:none;display:block}
.vframe.in{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out,opacity .9s ease}
.vstar{position:absolute;left:0;top:0;z-index:3;font-style:normal;font-size:20px;line-height:1;pointer-events:none;offset-path:inset(0 round 30px);offset-rotate:0deg;animation:run 7s linear infinite;text-shadow:0 0 10px #f7c65a,0 0 20px #f4a7b9}
@keyframes run{from{offset-distance:0%}to{offset-distance:100%}}
.vbeams{position:absolute;inset:-70px -30px -20px;pointer-events:none;overflow:hidden;z-index:-1}
.vbeams i{position:absolute;top:0;left:50%;width:70%;height:150%;background:linear-gradient(180deg,rgba(247,198,90,.4),transparent 75%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:50% 0;animation:sweep 6s ease-in-out infinite alternate}
.vbeams i:nth-child(2){background:linear-gradient(180deg,rgba(244,167,185,.4),transparent 75%);animation-direction:alternate-reverse;animation-duration:7.5s}
@keyframes sweep{from{transform:translateX(-50%) rotate(-30deg)}to{transform:translateX(-50%) rotate(30deg)}}
.bst{position:fixed;z-index:25;pointer-events:none;font-style:normal;transform:translate(-50%,-50%);animation:bst 1.4s ease-out forwards}
@keyframes bst{to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.5) rotate(180deg)}}
@media (prefers-reduced-motion:reduce){.vframe,.vstar,.vbeams i{animation:none}}
/* ===== professional polish ===== */
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#6b3b7a transparent}
::selection{background:var(--rose);color:#3a1f45}
h1,h2{text-wrap:balance;letter-spacing:-.01em}
p{text-wrap:pretty}
#hero h1{font-size:clamp(2.4rem,9vw,4.6rem)}
section{padding:5rem 1.25rem}
#site{animation:fadeIn .9s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#rest section+section::before{content:"";display:block;width:72px;height:1px;margin:0 auto 4.5rem;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.grid img,.ph,.vph,.clock div,.letter{border:1px solid rgba(244,167,185,.5);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 48px -14px rgba(0,0,0,.65)}
.clock div{background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.grid{gap:1.25rem}
.grid img:nth-child(odd).in,.grid img:nth-child(even).in{transform:none}
@media (hover:hover){.grid img.in:hover{transform:scale(1.025)}}
#blow{background:linear-gradient(180deg,#fad77a,#f2b93b);letter-spacing:.2px;transition:transform .2s ease}
#blow:hover{transform:translateY(-2px)}
#blow:active{transform:scale(.97)}
.vframe{animation-duration:10s}
.vframe::before{opacity:.4}
.vbeams i{opacity:.55}
.vstar{font-size:16px}
.vstar:nth-of-type(n+4){display:none}
.letter{padding:2.5rem 2rem}
.letter #letter{font-size:1.05rem;line-height:1.8}
.lp:first-child{font-size:1.2rem;font-weight:600}
.foot{text-align:center;color:var(--mute);font-size:.9rem;padding:2rem 1.25rem calc(3rem + env(safe-area-inset-bottom,0px))}
/* ===== scroll hint ===== */
#sd{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;gap:.1rem;color:var(--ink);font:600 .8rem Nunito,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:.6rem 1.2rem;border-radius:999px;background:rgba(34,16,43,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(244,167,185,.5);cursor:pointer;transition:opacity .4s ease,transform .4s ease;animation:sdIn .8s ease}
#sd span{display:block;font-size:1.2rem;line-height:1;color:var(--gold);animation:sdBob 1.4s ease-in-out infinite}
#sd.gone{opacity:0;pointer-events:none;transform:translate(-50%,10px)}
@keyframes sdIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes sdBob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){#sd span{animation:none}}
/* ===== creative envelope opening ===== */
section:has(#env){overflow-x:clip}
.e-rays{position:absolute;left:50%;top:50%;width:230%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:repeating-conic-gradient(rgba(247,198,90,.4) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);opacity:0;transition:opacity 1s ease .4s;pointer-events:none;z-index:-1;animation:raySpin 14s linear infinite}
@keyframes raySpin{to{rotate:360deg}}
#env.open .e-rays{opacity:1}
.e-glow{position:absolute;left:50%;top:40%;width:80%;height:80%;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.95),rgba(247,198,90,.5) 40%,transparent 70%);opacity:0;pointer-events:none}
#env.open .e-glow{opacity:1;transform:translate(-50%,-50%) scale(2.2);transition:opacity .8s ease .5s,transform 1.2s ease .5s}
#env.shake{animation:wig .5s ease}
@keyframes wig{0%,100%{rotate:0deg}20%{rotate:-4deg}40%{rotate:4deg}60%{rotate:-3deg}80%{rotate:2deg}}
#env.open .e-flap{transition-delay:.15s}
#env.open .e-paper{transform:translateY(-72%) scale(1.06);box-shadow:0 0 44px rgba(247,198,90,.75);transition:transform 1s cubic-bezier(.2,.8,.2,1) .8s,box-shadow .8s ease .8s}
#env.open .e-seal{animation:none;opacity:0;transform:translate(-50%,-50%) scale(1.7);transition:opacity .35s,transform .35s}
@media (prefers-reduced-motion:reduce){.e-rays,#env.shake{animation:none}}
.sign{font:600 1.9rem/1.3 Caveat,Georgia,cursive;color:#c2243f;text-align:right;margin:1.75rem 0 0}
.sign b{font-weight:600}
/* ===== wish scene ===== */
.cake{overflow:visible}
.smoke{fill:none;stroke:#fff4ee;stroke-width:2.2;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.cake.blown .smoke{animation:smoke 3.2s ease-out both}
@keyframes smoke{0%{opacity:0;transform:translateY(6px) scaleY(.5)}15%{opacity:.85}100%{opacity:0;transform:translateY(-34px) scaleY(1.4)}}
#wish{background:linear-gradient(90deg,#f7c65a,#fff4ee,#f4a7b9,#f7c65a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite,popIn 1s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
#wishsub{color:var(--mute);margin:.75rem 0 0;animation:fadeIn 1.5s ease .6s backwards}
.ring{position:fixed;z-index:0;width:60px;height:60px;border:2px solid rgba(247,198,90,.8);border-radius:50%;translate:-50% -50%;pointer-events:none;animation:ring 2.6s ease-out both}
@keyframes ring{from{scale:.3;opacity:.9}to{scale:7;opacity:0}}
.ln{position:fixed;bottom:-90px;z-index:0;width:var(--w);height:calc(var(--w) * 1.25);border-radius:18px 18px 10px 10px;background:linear-gradient(180deg,#ffd27a,#ff8a5c 70%,#e0527a);box-shadow:0 0 30px 8px rgba(255,170,90,.55);pointer-events:none;opacity:0;animation:lnUp var(--d) ease-in both,sway 3s ease-in-out infinite alternate}
.ln::after{content:"";position:absolute;left:25%;right:25%;bottom:-6px;height:6px;border-radius:0 0 4px 4px;background:#7a2d4a}
